<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spell Maker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Spell Maker</h1>

      <div class="mb-3">
        <label for="spellName" class="form-label">Spell Name:</label>
        <input type="text" class="form-control" id="spellName" />
      </div>

      <div class="mb-3">
        <label for="spellDescription" class="form-label">Description:</label>
        <textarea
          class="form-control"
          id="spellDescription"
          rows="3"
        ></textarea>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellLevel" class="form-label">Spell Level:</label>
            <select class="form-select" id="spellLevel">
              <option value="0">Cantrip</option>
              <option value="1">1st Level</option>
              <option value="2">2nd Level</option>
              <option value="3">3rd Level</option>
              <option value="4">4th Level</option>
              <option value="5">5th Level</option>
              <option value="6">6th Level</option>
              <option value="7">7th Level</option>
              <option value="8">8th Level</option>
              <option value="9">9th Level</option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellSchool" class="form-label">School of Magic:</label>
            <select class="form-select" id="spellSchool">
              <option value="Abjuration">Abjuration</option>
              <option value="Conjuration">Conjuration</option>
              <option value="Divination">Divination</option>
              <option value="Enchantment">Enchantment</option>
              <option value="Evocation">Evocation</option>
              <option value="Illusion">Illusion</option>
              <option value="Necromancy">Necromancy</option>
              <option value="Transmutation">Transmutation</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellCastingTime" class="form-label"
              >Casting Time:</label
            >
            <select class="form-select" id="spellCastingTime">
              <option value="1 Action">1 Action</option>
              <option value="1 Bonus Action">1 Bonus Action</option>
              <option value="1 Reaction">1 Reaction</option>
              <option value="1 Minute">1 Minute</option>
              <option value="10 Minutes">10 Minutes</option>
              <option value="1 Hour">1 Hour</option>
              <option value="8 Hours">8 Hours</option>
              <option value="12 Hours">12 Hours</option>
              <option value="24 Hours">24 Hours</option>
              <option value="Custom">Custom</option>
            </select>
            <input
              type="text"
              class="form-control mt-2 d-none"
              id="spellCastingTimeCustom"
              placeholder="Custom casting time"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellRange" class="form-label">Range:</label>
            <select class="form-select" id="spellRange">
              <option value="Self">Self</option>
              <option value="Touch">Touch</option>
              <option value="5 feet">5 feet</option>
              <option value="10 feet">10 feet</option>
              <option value="30 feet">30 feet</option>
              <option value="60 feet">60 feet</option>
              <option value="90 feet">90 feet</option>
              <option value="120 feet">120 feet</option>
              <option value="300 feet">300 feet</option>
              <option value="500 feet">500 feet</option>
              <option value="1 mile">1 mile</option>
              <option value="Sight">Sight</option>
              <option value="Unlimited">Unlimited</option>
              <option value="Custom">Custom</option>
            </select>
            <input
              type="text"
              class="form-control mt-2 d-none"
              id="spellRangeCustom"
              placeholder="Custom range"
            />
          </div>
        </div>
      </div>

      <!-- Components -->
      <div class="mb-3">
        <h3>Components</h3>
        <div class="row">
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="componentVerbal"
              />
              <label class="form-check-label" for="componentVerbal"
                >Verbal (V)</label
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="componentSomatic"
              />
              <label class="form-check-label" for="componentSomatic"
                >Somatic (S)</label
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="componentMaterial"
              />
              <label class="form-check-label" for="componentMaterial"
                >Material (M)</label
              >
            </div>
          </div>
        </div>
        <div id="materialComponentDiv" class="mt-2 d-none">
          <input
            type="text"
            class="form-control"
            id="materialComponents"
            placeholder="Material components (e.g., a diamond worth 100gp)"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellDuration" class="form-label">Duration:</label>
            <select class="form-select" id="spellDuration">
              <option value="Instantaneous">Instantaneous</option>
              <option value="1 Round">1 Round</option>
              <option value="1 Minute">1 Minute</option>
              <option value="10 Minutes">10 Minutes</option>
              <option value="1 Hour">1 Hour</option>
              <option value="8 Hours">8 Hours</option>
              <option value="24 Hours">24 Hours</option>
              <option value="7 Days">7 Days</option>
              <option value="Until Dispelled">Until Dispelled</option>
              <option value="Custom">Custom</option>
            </select>
            <input
              type="text"
              class="form-control mt-2 d-none"
              id="spellDurationCustom"
              placeholder="Custom duration"
            />
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="spellSource" class="form-label">Source:</label>
            <input
              type="text"
              class="form-control"
              id="spellSource"
              placeholder="e.g., Player's Handbook"
            />
          </div>
        </div>
      </div>

      <!-- Classes -->
      <div class="mb-3">
        <h3>Classes</h3>
        <div class="row">
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classArtificer"
              />
              <label class="form-check-label" for="classArtificer"
                >Artificer</label
              >
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="classBard" />
              <label class="form-check-label" for="classBard">Bard</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classCleric"
              />
              <label class="form-check-label" for="classCleric">Cleric</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="classDruid" />
              <label class="form-check-label" for="classDruid">Druid</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classPaladin"
              />
              <label class="form-check-label" for="classPaladin">Paladin</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classRanger"
              />
              <label class="form-check-label" for="classRanger">Ranger</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classSorcerer"
              />
              <label class="form-check-label" for="classSorcerer"
                >Sorcerer</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classWarlock"
              />
              <label class="form-check-label" for="classWarlock">Warlock</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classWizard"
              />
              <label class="form-check-label" for="classWizard">Wizard</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="classCustom"
              />
              <label class="form-check-label" for="classCustom">Custom</label>
            </div>
          </div>
        </div>
        <div id="customClassDiv" class="mt-2 d-none">
          <input
            type="text"
            class="form-control"
            id="customClass"
            placeholder="Custom class name"
          />
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="spellConcentration"
              />
              <label class="form-check-label" for="spellConcentration"
                >Requires Concentration</label
              >
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="spellRitual"
              />
              <label class="form-check-label" for="spellRitual"
                >Can be cast as a Ritual</label
              >
            </div>
          </div>
        </div>
      </div>

      <!-- Damage/Healing -->
      <div class="mb-3">
        <h3>Effects</h3>
        <div id="effectsContainer">
          <!-- Dynamic effect entries will be added here -->
        </div>
        <button
          type="button"
          class="btn btn-secondary btn-sm mt-2"
          onclick="addEffect()"
        >
          Add Effect
        </button>
      </div>

      <button class="btn btn-primary" onclick="generateSpell()">
        Generate Spell
      </button>

      <div class="mt-4">
        <h2>Generated JSON:</h2>
        <div
          id="output"
          class="border rounded p-3 bg-light font-monospace"
        ></div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/spells.js"></script>
  </body>
</html>
