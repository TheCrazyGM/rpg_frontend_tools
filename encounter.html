<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Encounter Builder</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Encounter Builder</h1>

      <div class="row">
        <!-- Party Information -->
        <div class="col-md-6">
          <h2>Party Information</h2>
          <div class="mb-3">
            <label for="partySize" class="form-label">Party Size:</label>
            <input
              type="number"
              class="form-control"
              id="partySize"
              min="1"
              value="4"
            />
          </div>

          <div class="mb-3">
            <label for="partyLevel" class="form-label"
              >Average Party Level:</label
            >
            <input
              type="number"
              class="form-control"
              id="partyLevel"
              min="1"
              max="20"
              value="1"
            />
          </div>

          <div class="mb-3">
            <label for="encounterDifficulty" class="form-label"
              >Desired Difficulty:</label
            >
            <select class="form-select" id="encounterDifficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
              <option value="deadly">Deadly</option>
            </select>
          </div>
        </div>

        <!-- Environment Settings -->
        <div class="col-md-6">
          <h2>Environment</h2>
          <div class="mb-3">
            <label for="terrain" class="form-label">Terrain Type:</label>
            <select class="form-select" id="terrain">
              <option value="dungeon">Dungeon</option>
              <option value="forest">Forest</option>
              <option value="mountain">Mountain</option>
              <option value="urban">Urban</option>
              <option value="coastal">Coastal</option>
              <option value="desert">Desert</option>
              <option value="arctic">Arctic</option>
              <option value="swamp">Swamp</option>
              <option value="underdark">Underdark</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="timeOfDay" class="form-label">Time of Day:</label>
            <select class="form-select" id="timeOfDay">
              <option value="day">Day</option>
              <option value="night">Night</option>
              <option value="dawn">Dawn/Dusk</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="environmentalEffects" class="form-label"
              >Environmental Effects:</label
            >
            <select class="form-select" id="environmentalEffects" multiple>
              <option value="darkness">Darkness</option>
              <option value="difficult_terrain">Difficult Terrain</option>
              <option value="cover">Partial Cover</option>
              <option value="fog">Fog/Mist</option>
              <option value="water">Standing Water</option>
              <option value="hazards">Natural Hazards</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Monsters Section -->
      <h2 class="mt-4">Monsters</h2>
      <div id="monstersContainer">
        <div class="monster-entry mb-3">
          <div class="row">
            <div class="col-md-4">
              <label class="form-label">Monster Name:</label>
              <input
                type="text"
                class="form-control monster-name"
                placeholder="e.g., Goblin"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">CR:</label>
              <input
                type="number"
                class="form-control monster-cr"
                step="0.125"
                min="0"
                value="0.25"
              />
            </div>
            <div class="col-md-2">
              <label class="form-label">Quantity:</label>
              <input
                type="number"
                class="form-control monster-quantity"
                min="1"
                value="1"
              />
            </div>
            <div class="col-md-4">
              <label class="form-label">Role:</label>
              <select class="form-select monster-role">
                <option value="soldier">Soldier (Basic Combat)</option>
                <option value="brute">Brute (High HP/Damage)</option>
                <option value="controller">Controller (Crowd Control)</option>
                <option value="leader">Leader (Buffs/Commands)</option>
                <option value="artillery">Artillery (Ranged)</option>
                <option value="lurker">Lurker (Stealth/Ambush)</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-secondary mb-3" onclick="addMonsterEntry()">
        Add Another Monster
      </button>

      <!-- Tactical Considerations -->
      <div class="mb-3">
        <label for="tacticalNotes" class="form-label">Tactical Notes:</label>
        <textarea
          class="form-control"
          id="tacticalNotes"
          rows="3"
          placeholder="Enter tactical considerations, monster strategies, or environmental interactions..."
        ></textarea>
      </div>

      <button class="btn btn-primary" onclick="generateJSON()">
        Generate Encounter
      </button>

      <h2 class="mt-4">Encounter Details:</h2>
      <div id="output"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/encounter.js"></script>
  </body>
</html>
