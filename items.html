<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magic Item Maker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Magic Item Maker</h1>

      <div class="mb-3">
        <label for="itemName" class="form-label">Item Name:</label>
        <input type="text" class="form-control" id="itemName" />
      </div>

      <div class="mb-3">
        <label for="itemDescription" class="form-label">Description:</label>
        <textarea class="form-control" id="itemDescription" rows="3"></textarea>
      </div>

      <div class="mb-3">
        <label for="itemType" class="form-label">Item Type:</label>
        <select class="form-select" id="itemType">
          <option value="Weapon">Weapon</option>
          <option value="Armor">Armor</option>
          <option value="Potion">Potion</option>
          <option value="Ring">Ring</option>
          <option value="Rod">Rod</option>
          <option value="Staff">Staff</option>
          <option value="Wand">Wand</option>
          <option value="Scroll">Scroll</option>
          <option value="Wondrous Item">Wondrous Item</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="itemRarity" class="form-label">Rarity:</label>
        <select class="form-select" id="itemRarity">
          <option value="Common">Common</option>
          <option value="Uncommon">Uncommon</option>
          <option value="Rare">Rare</option>
          <option value="Very Rare">Very Rare</option>
          <option value="Legendary">Legendary</option>
          <option value="Artifact">Artifact</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="itemAttunement" class="form-label"
          >Requires Attunement:</label
        >
        <select class="form-select" id="itemAttunement">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="itemAttunementDescription" class="form-label"
          >Attunement Description (if applicable):</label
        >
        <textarea
          class="form-control"
          id="itemAttunementDescription"
          rows="2"
        ></textarea>
      </div>

      <div class="mb-3">
        <label for="itemProperties" class="form-label">Properties:</label>
        <div class="row g-3">
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Finesse"
                id="propertyFinesse"
              />
              <label class="form-check-label" for="propertyFinesse"
                >Finesse</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Light"
                id="propertyLight"
              />
              <label class="form-check-label" for="propertyLight">Light</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Heavy"
                id="propertyHeavy"
              />
              <label class="form-check-label" for="propertyHeavy">Heavy</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Versatile"
                id="propertyVersatile"
              />
              <label class="form-check-label" for="propertyVersatile"
                >Versatile</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Thrown"
                id="propertyThrown"
              />
              <label class="form-check-label" for="propertyThrown"
                >Thrown</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Two-Handed"
                id="propertyTwoHanded"
              />
              <label class="form-check-label" for="propertyTwoHanded"
                >Two-Handed</label
              >
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Reach"
                id="propertyReach"
              />
              <label class="form-check-label" for="propertyReach">Reach</label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Ammunition"
                id="propertyAmmunition"
              />
              <label class="form-check-label" for="propertyAmmunition"
                >Ammunition</label
              >
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value="Loading"
                id="propertyLoading"
              />
              <label class="form-check-label" for="propertyLoading"
                >Loading</label
              >
            </div>
          </div>
        </div>
        <div class="mt-2">
          <label for="customProperties" class="form-label"
            >Additional Properties:</label
          >
          <input
            type="text"
            class="form-control"
            id="customProperties"
            placeholder="Enter custom properties, comma-separated"
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Magical Properties:</label>
        <div id="magicalPropertiesContainer">
          <div class="magical-property mb-2">
            <div class="row g-2">
              <div class="col-md-4">
                <input
                  type="text"
                  class="form-control property-name"
                  placeholder="Property Name"
                />
              </div>
              <div class="col-md-7">
                <input
                  type="text"
                  class="form-control property-description"
                  placeholder="Property Description"
                />
              </div>
              <div class="col-md-1">
                <button
                  type="button"
                  class="btn btn-danger btn-sm remove-property"
                  onclick="removeProperty(this)"
                >
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>
        <button
          type="button"
          class="btn btn-secondary btn-sm mt-2"
          onclick="addMagicalProperty()"
        >
          Add Magical Property
        </button>
      </div>

      <div class="mb-3">
        <label for="itemCursed" class="form-label">Cursed:</label>
        <select class="form-select" id="itemCursed">
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="itemCurseDetails" class="form-label"
          >Curse Details (if applicable):</label
        >
        <textarea
          class="form-control"
          id="itemCurseDetails"
          rows="2"
        ></textarea>
      </div>

      <button class="btn btn-primary" onclick="generateItem()">
        Generate Item
      </button>

      <div class="mt-4">
        <h2>Generated Item:</h2>
        <div id="output" class="border rounded p-3 bg-light"></div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/items.js"></script>
  </body>
</html>
