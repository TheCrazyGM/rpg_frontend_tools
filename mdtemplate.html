<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Character Sheet Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    crossorigin="anonymous" />
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
  <div class="container mt-5">
    <h1>Markdown Character Sheet Generator</h1>
    <form id="characterForm">
      <div class="mb-3">
        <label for="characterName" class="form-label">Character Name</label>
        <input type="text" class="form-control" id="characterName" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Templates (Classes, Archetypes, etc.)</label>
        <div id="templatesList"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addTemplate">Add Template</button>
        <div id="templateMinMsg" class="text-warning small mt-1" style="display:none;">A character must have at least 1 template!</div>
      </div>
      <div class="mb-3">
        <label for="level" class="form-label">Character Level</label>
        <input type="text" class="form-control" id="level" />
      </div>
      <div class="mb-3">
        <label class="form-label">Race / Size</label>
        <div class="input-group">
          <input type="text" class="form-control" id="race" placeholder="e.g. Medium, Human" />
          <input type="text" class="form-control" id="raceUrl" placeholder="URL (optional)" />
        </div>
      </div>
      <div class="mb-3">
        <label for="alignment" class="form-label">Alignment</label>
        <input type="text" class="form-control" id="alignment" placeholder="e.g. chaotic, good" />
      </div>
      <div class="mb-3">
        <label for="initiative" class="form-label">Initiative</label>
        <input type="text" class="form-control" id="initiative" />
      </div>
      <div class="mb-3">
        <label for="senses" class="form-label">Senses</label>
        <input type="text" class="form-control" id="senses" />
      </div>
      <div class="mb-3">
        <label for="perception" class="form-label">Perception</label>
        <input type="text" class="form-control" id="perception" />
      </div>
      <div class="mb-3">
        <label for="ac" class="form-label">AC</label>
        <input type="text" class="form-control" id="ac" placeholder="e.g. 12" />
      </div>
      <div class="mb-3">
        <label for="acDetails" class="form-label">AC Details (Touch, Flat-footed)</label>
        <input type="text" class="form-control" id="acDetails" placeholder="e.g. touch:12, flat-footed:29(31)" />
      </div>
      <div class="mb-3">
        <label for="acMods" class="form-label">AC Modifiers</label>
        <input type="text" class="form-control" id="acMods" placeholder="e.g. +2 Dex" />
      </div>
      <div class="mb-3">
        <label for="hp" class="form-label">HP</label>
        <input type="text" class="form-control" id="hp" placeholder="e.g. 8 (1d6 + 4)" />
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label for="saveFort" class="form-label">Fortitude</label>
          <input type="text" class="form-control" id="saveFort" placeholder="e.g. +4" />
        </div>
        <div class="col">
          <label for="saveReflex" class="form-label">Reflex</label>
          <input type="text" class="form-control" id="saveReflex" placeholder="e.g. +1" />
        </div>
        <div class="col">
          <label for="saveWill" class="form-label">Will</label>
          <input type="text" class="form-control" id="saveWill" placeholder="e.g. +6 (+7 vs. fear)" />
        </div>
      </div>
      <div class="mb-3">
        <label for="speed" class="form-label">Speed</label>
        <input type="text" class="form-control" id="speed" />
      </div>
      <div class="mb-3">
        <label class="form-label">Attacks</label>
        <div id="attacksList"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addAttack">Add Attack</button>
        <div id="attackMinMsg" class="text-warning small mt-1" style="display:none;">A character must have at least 1 attack entry!</div>
      </div>
      <div class="mb-3">
        <label for="specialAttacks" class="form-label">Special Attacks</label>
        <input type="text" class="form-control" id="specialAttacks" />
      </div>
      <div class="mb-3">
        <label for="spellcasting" class="form-label">Spellcasting</label>
        <select class="form-select" id="spellcasting">
          <option value="none">None</option>
          <option value="prepared">Prepared</option>
          <option value="spontaneous">Spontaneous</option>
        </select>
      </div>
      <div id="spellcastingSection" style="display:none;">
        <div class="mb-3">
          <label for="casterLevel" class="form-label">Caster Level (CL)</label>
          <input type="text" class="form-control" id="casterLevel" placeholder="e.g. 1st, 3rd, 5th" />
        </div>
        <div class="mb-3">
          <label class="form-label" id="spellsLabel">Spells</label>
          <div id="spellsKnownList"></div>
          <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addSpellKnown">Add Spell Row</button>
        </div>
        <div class="mb-3" id="spontaneousToggleWrapper" style="display:none;">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="includeSpontaneousPrepared" />
            <label class="form-check-label" for="includeSpontaneousPrepared">Also include a Spells Prepared table</label>
          </div>
          <div id="spontaneousPreparedSection" style="display:none;" class="mt-2">
            <div id="spontaneousPreparedList"></div>
            <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addSpontaneousPrepared">Add Spell Row</button>
          </div>
        </div>
        <div class="mb-3" id="spellsKnownToggleWrapper" style="display:none;">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="includeSpellsKnown" />
            <label class="form-check-label" for="includeSpellsKnown">Also include a Spells Known table</label>
          </div>
          <div id="spellsKnownExtraSection" style="display:none;" class="mt-2">
            <div id="spellsKnownExtraList"></div>
            <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addSpellKnownExtra">Add Spell Row</button>
          </div>
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" id="includeSpellbook" />
            <label class="form-check-label" for="includeSpellbook">Also include a Spellbook table</label>
          </div>
          <div id="spellbookSection" style="display:none;" class="mt-2">
            <div id="spellbookList"></div>
            <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addSpellbookEntry">Add Spell Row</button>
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Ability Scores</label>
        <div class="row g-2">
          <div class="col"><label class="form-label small">Str</label><input type="text" class="form-control" id="aStr" value="10" /></div>
          <div class="col"><label class="form-label small">Dex</label><input type="text" class="form-control" id="aDex" value="10" /></div>
          <div class="col"><label class="form-label small">Con</label><input type="text" class="form-control" id="aCon" value="10" /></div>
          <div class="col"><label class="form-label small">Int</label><input type="text" class="form-control" id="aInt" value="10" /></div>
          <div class="col"><label class="form-label small">Wis</label><input type="text" class="form-control" id="aWis" value="10" /></div>
          <div class="col"><label class="form-label small">Cha</label><input type="text" class="form-control" id="aCha" value="10" /></div>
        </div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col">
          <label for="bab" class="form-label">Base Attack Bonus (BAB)</label>
          <input type="text" class="form-control" id="bab" value="+0" />
        </div>
        <div class="col">
          <label for="cmb" class="form-label">CMB</label>
          <input type="text" class="form-control" id="cmb" value="+0" />
        </div>
        <div class="col">
          <label for="cmd" class="form-label">CMD</label>
          <input type="text" class="form-control" id="cmd" value="+0" />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Feats</label>
        <div id="featsList"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addFeat">Add Feat</button>
        <div id="featMinMsg" class="text-warning small mt-1" style="display:none;">Every PC has at least 1 feat!</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Traits</label>
        <div id="traitsList"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addTrait">Add Trait</button>
        <div id="traitMinMsg" class="text-warning small mt-1" style="display:none;">Every PC has at least 1 trait!</div>
      </div>
      <div class="mb-3">
        <label for="skills" class="form-label">Skills</label>
        <input type="text" class="form-control" id="skills"
          placeholder="e.g. Bluff:+8, Perception:+6, Spellcraft:+5, Use Magic Device:+8" />
      </div>
      <div class="mb-3">
        <label for="specialAbilities" class="form-label">Special Abilities</label>
        <textarea class="form-control" id="specialAbilities" rows="2"
          placeholder="e.g. Horrific Visage (Su):Will save DC 15 or become shaken for 1 round; 5/day"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Notable Features</label>
        <div id="notableFeaturesList"></div>
        <button type="button" class="btn btn-sm btn-outline-primary mt-2" id="addNotableFeature">Add Notable Feature</button>
      </div>
      <div class="mb-3">
        <label for="equipment" class="form-label">Equipment</label>
        <textarea class="form-control" id="equipment" rows="2"
          placeholder="e.g. Silken Rope, 50ft; Small Tent; Backpack, Blanket, Bedroll; 47gp"></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Generate Markdown</button>
    </form>
    <hr />
    <h2>Generated Markdown</h2>
    <pre id="markdownOutput" class="bg-light p-3 border"></pre>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script src="js/mdtemplate.js"></script>
</body>

</html>
