<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adventure Creator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Adventure Creator</h1>

      <div class="row">
        <!-- Basic Information -->
        <div class="col-md-6">
          <h2>Basic Information</h2>
          <div class="mb-3">
            <label for="adventureName" class="form-label"
              >Adventure Name:</label
            >
            <input type="text" class="form-control" id="adventureName" />
          </div>

          <div class="mb-3">
            <label for="levelRange" class="form-label">Level Range:</label>
            <div class="row">
              <div class="col">
                <input
                  type="number"
                  class="form-control"
                  id="minLevel"
                  placeholder="Min"
                  min="1"
                  max="20"
                  value="1"
                />
              </div>
              <div class="col">
                <input
                  type="number"
                  class="form-control"
                  id="maxLevel"
                  placeholder="Max"
                  min="1"
                  max="20"
                  value="4"
                />
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label for="setting" class="form-label">Setting:</label>
            <input
              type="text"
              class="form-control"
              id="setting"
              placeholder="e.g., Forgotten Realms, Homebrew World"
            />
          </div>

          <div class="mb-3">
            <label for="theme" class="form-label">Theme/Style:</label>
            <select class="form-select" id="theme">
              <option value="dungeon_crawl">Dungeon Crawl</option>
              <option value="mystery">Mystery/Investigation</option>
              <option value="political">Political Intrigue</option>
              <option value="exploration">Exploration/Wilderness</option>
              <option value="horror">Horror</option>
              <option value="heist">Heist</option>
              <option value="war">Military/War</option>
            </select>
          </div>
        </div>

        <!-- Overview -->
        <div class="col-md-6">
          <h2>Overview</h2>
          <div class="mb-3">
            <label for="hook" class="form-label">Adventure Hook:</label>
            <textarea
              class="form-control"
              id="hook"
              rows="3"
              placeholder="What draws the players into this adventure?"
            ></textarea>
          </div>

          <div class="mb-3">
            <label for="summary" class="form-label">Summary:</label>
            <textarea
              class="form-control"
              id="summary"
              rows="3"
              placeholder="Brief overview of the adventure's plot"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Locations -->
      <h2 class="mt-4">Locations</h2>
      <div id="locationsContainer">
        <div class="location-entry mb-3 border p-3">
          <div class="row">
            <div class="col-md-4">
              <label class="form-label">Location Name:</label>
              <input
                type="text"
                class="form-control location-name"
                placeholder="e.g., Ancient Temple"
              />
            </div>
            <div class="col-md-4">
              <label class="form-label">Type:</label>
              <select class="form-select location-type">
                <option value="dungeon">Dungeon</option>
                <option value="wilderness">Wilderness</option>
                <option value="urban">Urban</option>
                <option value="underground">Underground</option>
                <option value="planar">Planar</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Difficulty:</label>
              <select class="form-select location-difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
                <option value="deadly">Deadly</option>
              </select>
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Description:</label>
            <textarea
              class="form-control location-description"
              rows="2"
            ></textarea>
          </div>
          <button
            class="btn btn-danger btn-sm"
            onclick="this.parentElement.remove()"
          >
            Remove Location
          </button>
        </div>
      </div>
      <button class="btn btn-secondary mb-3" onclick="addLocation()">
        Add Location
      </button>

      <!-- NPCs -->
      <h2 class="mt-4">Key NPCs</h2>
      <div id="npcsContainer">
        <div class="npc-entry mb-3 border p-3">
          <div class="row">
            <div class="col-md-4">
              <label class="form-label">NPC Name:</label>
              <input type="text" class="form-control npc-name" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Role:</label>
              <select class="form-select npc-role">
                <option value="ally">Ally</option>
                <option value="villain">Villain</option>
                <option value="neutral">Neutral</option>
                <option value="quest_giver">Quest Giver</option>
                <option value="merchant">Merchant</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Race/Type:</label>
              <input
                type="text"
                class="form-control npc-race"
                placeholder="e.g., Human, Dragon"
              />
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Description/Motivation:</label>
            <textarea class="form-control npc-description" rows="2"></textarea>
          </div>
          <button
            class="btn btn-danger btn-sm"
            onclick="this.parentElement.remove()"
          >
            Remove NPC
          </button>
        </div>
      </div>
      <button class="btn btn-secondary mb-3" onclick="addNPC()">Add NPC</button>

      <!-- Rewards -->
      <h2 class="mt-4">Rewards</h2>
      <div id="rewardsContainer">
        <div class="reward-entry mb-3 border p-3">
          <div class="row">
            <div class="col-md-4">
              <label class="form-label">Reward Type:</label>
              <select class="form-select reward-type">
                <option value="treasure">Treasure</option>
                <option value="magic_item">Magic Item</option>
                <option value="information">Information</option>
                <option value="favor">Favor/Alliance</option>
                <option value="property">Property/Land</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Value/Name:</label>
              <input type="text" class="form-control reward-value" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Location:</label>
              <input
                type="text"
                class="form-control reward-location"
                placeholder="Where is it found?"
              />
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Description:</label>
            <textarea
              class="form-control reward-description"
              rows="2"
            ></textarea>
          </div>
          <button
            class="btn btn-danger btn-sm"
            onclick="this.parentElement.remove()"
          >
            Remove Reward
          </button>
        </div>
      </div>
      <button class="btn btn-secondary mb-3" onclick="addReward()">
        Add Reward
      </button>

      <!-- Notes -->
      <div class="mb-3">
        <label for="notes" class="form-label">Additional Notes:</label>
        <textarea
          class="form-control"
          id="notes"
          rows="3"
          placeholder="Any other important information about the adventure..."
        ></textarea>
      </div>

      <button class="btn btn-primary" onclick="generateAdventure()">
        Create Adventure
      </button>

      <div id="output" class="mt-4"></div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/adventure.js"></script>
  </body>
</html>
