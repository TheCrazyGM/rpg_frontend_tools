<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feat Maker</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="css/styles.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container mt-5">
      <h1>Feat Maker</h1>

      <div class="mb-3">
        <label for="featName" class="form-label">Feat Name:</label>
        <input type="text" class="form-control" id="featName" />
      </div>

      <div class="mb-3">
        <label for="featDescription" class="form-label">Description:</label>
        <textarea class="form-control" id="featDescription" rows="3"></textarea>
      </div>

      <!-- Prerequisites -->
      <div class="mb-3">
        <h3>Prerequisites</h3>
        <div id="prerequisitesContainer">
          <!-- Dynamic prerequisite entries will be added here -->
        </div>
        <button
          type="button"
          class="btn btn-secondary btn-sm mt-2"
          onclick="addPrerequisite()"
        >
          Add Prerequisite
        </button>
      </div>

      <!-- Benefits -->
      <div class="mb-3">
        <h3>Benefits</h3>
        <div id="benefitsContainer">
          <!-- Dynamic benefit entries will be added here -->
        </div>
        <button
          type="button"
          class="btn btn-secondary btn-sm mt-2"
          onclick="addBenefit()"
        >
          Add Benefit
        </button>
      </div>

      <div class="mb-3">
        <label for="featSpecial" class="form-label">Special Notes:</label>
        <textarea
          class="form-control"
          id="featSpecial"
          rows="2"
          placeholder="Any special rules or exceptions"
        ></textarea>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="mb-3">
            <label for="featType" class="form-label">Feat Type:</label>
            <select class="form-select" id="featType">
              <option value="General">General</option>
              <option value="Combat">Combat</option>
              <option value="Skill">Skill</option>
              <option value="Metamagic">Metamagic</option>
              <option value="Item Creation">Item Creation</option>
              <option value="Teamwork">Teamwork</option>
              <option value="Racial">Racial</option>
              <option value="Style">Style</option>
              <option value="Story">Story</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="col-md-6">
          <div class="mb-3">
            <label for="featSource" class="form-label">Source:</label>
            <input
              type="text"
              class="form-control"
              id="featSource"
              placeholder="e.g., Player's Handbook"
            />
          </div>
        </div>
      </div>

      <!-- Optional Tags -->
      <div class="mb-3">
        <h3>Tags</h3>
        <div class="row">
          <div class="col-md-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagAction" />
              <label class="form-check-label" for="tagAction">Action</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagBonus" />
              <label class="form-check-label" for="tagBonus">Bonus</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagCombat" />
              <label class="form-check-label" for="tagCombat">Combat</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagMagic" />
              <label class="form-check-label" for="tagMagic">Magic</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagPassive" />
              <label class="form-check-label" for="tagPassive">Passive</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagSkill" />
              <label class="form-check-label" for="tagSkill">Skill</label>
            </div>
          </div>
          <div class="col-md-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagSocial" />
              <label class="form-check-label" for="tagSocial">Social</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagUtility" />
              <label class="form-check-label" for="tagUtility">Utility</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="tagWeapon" />
              <label class="form-check-label" for="tagWeapon">Weapon</label>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="generateFeat()">
        Generate Feat
      </button>

      <div class="mt-4">
        <h2>Generated JSON:</h2>
        <div
          id="output"
          class="border rounded p-3 bg-light font-monospace"
        ></div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="js/feats.js"></script>
  </body>
</html>
